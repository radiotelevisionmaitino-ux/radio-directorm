
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sintonizador Maitino</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #alert-banner { position: absolute; top: 20px; color: red; font-family: monospace; font-weight: bold; display: none; }
        audio { outline: none; }
    </style>
</head>
<body>

    <div id="alert-banner">⚠️ ALERTA: TONO DE EMERGENCIA DETECTADO</div>
    <audio id="player" controls autoplay playsinline></audio>

<script>
    const player = document.getElementById('player');
    const alertBanner = document.getElementById('alert-banner');
    
    const HOST_PRIVADO = 'maitino-studio-host-v2';
    const HOST_PUBLICO = 'maitino-studio-host-public-v2';
    
    let peer, audioCtx, analyser;

    function conectar(usarPublico = false) {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        let config = {
            config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
        };
        
        if (!usarPublico) {
            config.host = 'maitino-peer-server.onrender.com';
            config.port = 443;
            config.secure = true;
        }

        peer = new Peer(config);

        peer.on('open', () => {
            let target = usarPublico ? HOST_PUBLICO : HOST_PRIVADO;
            
            // Creamos un stream vacío para forzar la llamada desde el receptor
            const dummyStream = audioCtx.createMediaStreamDestination().stream;
            const call = peer.call(target, dummyStream);

            call.on('stream', (remoteStream) => {
                player.srcObject = remoteStream;
                player.play().catch(() => console.log("Autoplay bloqueado, requiere clic manual"));
                analizarFrecuencias(remoteStream);
            });

            call.on('error', () => fallback(usarPublico));
            call.on('close', () => fallback(usarPublico));
        });

        peer.on('error', () => fallback(usarPublico));
    }

    function fallback(usarPublico) {
        if (peer) peer.destroy();
        if (!usarPublico) {
            console.log("Fallo en servidor Render, saltando a red pública STUN...");
            conectar(true);
        } else {
            console.log("Sin conexión. Reintentando en 5 segundos...");
            setTimeout(() => conectar(false), 5000);
        }
    }

    function analizarFrecuencias(stream) {
        try {
            const src = audioCtx.createMediaStreamSource(stream);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            src.connect(analyser);

            const buffer = new Uint8Array(analyser.frequencyBinCount);
            
            function check() {
                requestAnimationFrame(check);
                analyser.getByteFrequencyData(buffer);
                let highFreqIndex = Math.floor((18000 / (audioCtx.sampleRate / 2)) * analyser.frequencyBinCount);
                
                if (buffer[highFreqIndex] > 200) {
                    alertBanner.style.display = 'block';
                } else {
                    alertBanner.style.display = 'none';
                }
            }
            check();
        } catch(e) {
            console.error(e);
        }
    }

    // Auto-iniciar al cargar la página
    window.onload = () => conectar(false);
    
    // Intentar reanudar el contexto de audio si el usuario interactúa con la pantalla
    document.body.addEventListener('click', () => {
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }, { once: true });
</script>
</body>
</html>
