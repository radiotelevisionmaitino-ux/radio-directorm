
<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Maitino | Sintonizador de Emergencia</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: monospace; }
        audio { width: 300px; margin-top: 20px; }
        #alert-banner { display: none; background: #ff1a1a; color: #fff; padding: 10px 20px; font-weight: bold; border-radius: 5px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="alert-banner">⚠️ ALERTA: TONO DE EMERGENCIA DETECTADO</div>
    <audio id="player" controls autoplay playsinline></audio>

<script>
    const player = document.getElementById('player');
    const alertBanner = document.getElementById('alert-banner');
    
    // Servidores de respaldo
    const HOST_PRIVADO = 'maitino-studio-host-v2';
    const HOST_PUBLICO = 'maitino-studio-host-public-v2';
    
    let peer, dataConn, audioCtx, analyser;

    function conectar(usarPublico = false) {
        let config = {
            config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
        };
        if (!usarPublico) {
            config.host = 'maitino-peer-server.onrender.com';
            config.port = 443;
            config.secure = true;
        }

        peer = new Peer(config);

        peer.on('open', () => {
            let target = usarPublico ? HOST_PUBLICO : HOST_PRIVADO;
            dataConn = peer.connect(target, { reliable: true });
            dataConn.on('open', () => dataConn.send({ command: 'check_live' }));
        });

        peer.on('call', (call) => {
            call.answer(null); // Solo recibir
            call.on('stream', (stream) => {
                player.srcObject = stream;
                player.play().catch(() => {});
                
                // Analizador en segundo plano para tonos/ultrasonidos
                analizarFrecuencias(stream);
            });
        });

        peer.on('error', () => {
            if (!usarPublico) {
                peer.destroy();
                conectar(true); // Fallback a la red pública
            } else {
                setTimeout(() => conectar(false), 5000);
            }
        });
    }

    // Detector de tonos de control / ultrasonidos (Ej. 18kHz o 800Hz)
    function analizarFrecuencias(stream) {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const src = audioCtx.createMediaStreamSource(stream);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            src.connect(analyser);

            const buffer = new Uint8Array(analyser.frequencyBinCount);
            
            function check() {
                requestAnimationFrame(check);
                analyser.getByteFrequencyData(buffer);
                
                // Índice aproximado para altas frecuencias (ultrasonido ~18kHz en muestra de 48kHz)
                let highFreqIndex = Math.floor((18000 / (audioCtx.sampleRate / 2)) * analyser.frequencyBinCount);
                
                // Si la energía en esa frecuencia supera un umbral, se activa la alerta visual
                if (buffer[highFreqIndex] > 200) {
                    alertBanner.style.display = 'block';
                } else {
                    alertBanner.style.display = 'none';
                }
            }
            check();
        } catch(e) {}
    }

    window.onload = () => conectar(false);
</script>
</body>
</html>
