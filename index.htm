
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Maitino | En Directo</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        audio {
            width: 320px;
            outline: none;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <audio id="native-player" controls autoplay playsinline></audio>

<script>
    const player = document.getElementById('native-player');
    
    const HOST_PRIVADO = 'maitino-studio-host-v2';
    const HOST_PUBLICO = 'maitino-studio-host-public-v2';
    
    let peer;
    let dataConn;
    let reconectando = false;

    function iniciarReceptor(usarPublico = false) {
        let peerConfig = {
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' }
                ]
            }
        };

        if (!usarPublico) {
            peerConfig.host = 'maitino-peer-server.onrender.com';
            peerConfig.port = 443;
            peerConfig.secure = true;
        }

        peer = new Peer(peerConfig);

        peer.on('open', (id) => {
            const targetHost = usarPublico ? HOST_PUBLICO : HOST_PRIVADO;
            
            dataConn = peer.connect(targetHost, { reliable: true });

            dataConn.on('open', () => {
                dataConn.send({ command: 'check_live' });
            });

            dataConn.on('close', () => programarReconexion());
        });

        peer.on('call', (call) => {
            call.answer(null); 
            
            call.on('stream', (remoteStream) => {
                player.srcObject = remoteStream;
                player.play().catch(e => console.warn("AutoPlay bloqueado. Requiere interacción manual."));
            });

            call.on('close', () => {
                player.srcObject = null;
                programarReconexion();
            });
        });

        peer.on('error', (err) => {
            if (!usarPublico && (err.type === 'network' || err.type === 'server-error' || err.type === 'peer-unavailable')) {
                console.warn("Servidor privado inactivo. Saltando a red de emergencia...");
                peer.destroy();
                iniciarReceptor(true);
            } else {
                programarReconexion();
            }
        });

        peer.on('disconnected', () => {
            if (!peer.destroyed) peer.reconnect();
        });
    }

    function programarReconexion() {
        if (reconectando) return;
        reconectando = true;
        
        setTimeout(() => {
            reconectando = false;
            if (peer) peer.destroy();
            iniciarReceptor();
        }, 5000);
    }

    window.onload = () => iniciarReceptor(false);

</script>
</body>
</html>
