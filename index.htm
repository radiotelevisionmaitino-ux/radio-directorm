<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sintonizador Maitino</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { 
            background: #000; 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: monospace;
        }
        #status {
            color: #888;
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        audio { 
            outline: none; 
            width: 300px;
        }
    </style>
</head>
<body>

    <div id="status">Conectando...</div>
    <audio id="player" controls autoplay playsinline></audio>

<script>
    const player = document.getElementById('player');
    const statusText = document.getElementById('status');
    
    const HOST_PRIVADO = 'maitino-studio-host-v2';
    
    let peer, audioCtx;
    let retryCount = 0;
    let currentCall = null;
    let keepAliveInterval = null;

    function conectar() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (peer) peer.destroy();

        peer = new Peer({
            host: 'maitino-peer-server.onrender.com',
            port: 443,
            secure: true,
            config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
        });

        peer.on('open', () => {
            statusText.innerText = "Sintonizando...";
            statusText.style.color = "#888";
            
            // Stream vacío necesario para iniciar la llamada WebRTC
            const dummyStream = audioCtx.createMediaStreamDestination().stream;
            
            // Llamamos al estudio identificándonos como oyente
            currentCall = peer.call(HOST_PRIVADO, dummyStream, { metadata: { role: 'listener' } });

            currentCall.on('stream', (remoteStream) => {
                retryCount = 0; // Conexión exitosa, reseteamos reintentos
                statusText.innerText = "● EN DIRECTO";
                statusText.style.color = "#ff1a1a";
                
                player.srcObject = remoteStream;
                player.play().catch(() => {
                    statusText.innerText = "Pulsa PLAY para escuchar";
                    statusText.style.color = "#ffb300";
                });
            });

            currentCall.on('error', manejarDesconexion);
            currentCall.on('close', manejarDesconexion);

            // Vigilar estado de la red (WiFi/4G)
            currentCall.peerConnection.addEventListener('iceconnectionstatechange', () => {
                const state = currentCall.peerConnection.iceConnectionState;
                if (state === 'disconnected' || state === 'failed' || state === 'closed') {
                    manejarDesconexion();
                }
            });
        });

        peer.on('error', manejarDesconexion);

        peer.on('disconnected', () => {
            if (!peer.destroyed) peer.reconnect();
        });

        // Mantener vivo el túnel con el servidor de Render
        clearInterval(keepAliveInterval);
        keepAliveInterval = setInterval(() => {
            if (peer && !peer.disconnected && !peer.destroyed) {
                peer.socket.send({ type: 'PING' });
            }
        }, 15000);
    }

    function manejarDesconexion() {
        statusText.innerText = "Reconectando...";
        statusText.style.color = "#888";
        
        if (currentCall) {
            currentCall.close();
            currentCall = null;
        }

        // Reconexión inteligente (espera progresiva para no saturar)
        const retraso = Math.min(2000 * Math.pow(2, retryCount), 30000);
        retryCount++;
        
        setTimeout(conectar, retraso);
    }

    // Auto-iniciar al cargar la página
    window.onload = conectar;
    
    // Desbloquear audio si el usuario interactúa
    document.body.addEventListener('click', () => {
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    });
</script>
</body>
</html>
