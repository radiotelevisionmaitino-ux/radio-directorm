<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directo | Radio Maitino</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* Fondo negro y reproductor centrado, igual que tu captura */
        body { 
            background-color: #000; 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        audio {
            width: 300px;
            outline: none;
        }
    </style>
</head>
<body>

    <audio id="reproductor" controls autoplay></audio>

    <script>
        const MASTER_ID = 'maitino-studio-host';
        const reproductor = document.getElementById('reproductor');
        
        let peer = null;
        let pingInterval = null;

        function iniciarReceptor() {
            // 1. Iniciamos la conexión P2P
            peer = new Peer({ config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] } });

            peer.on('open', () => {
                conectarAlEstudio();
            });

            // 2. Recibimos el audio (La llamada del Estudio)
            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (stream) => {
                    reproductor.srcObject = stream;
                    
                    // Intentamos forzar la reproducción
                    reproductor.play().catch(err => {
                        console.warn("El navegador bloqueó el autoplay. El usuario debe pulsar el botón de Play manualmente.", err);
                    });
                });
                
                // Si el estudio corta la llamada, vaciamos el reproductor
                call.on('close', () => {
                    reproductor.srcObject = null;
                });
            });

            // Si perdemos conexión con el servidor de PeerJS, reconectamos
            peer.on('disconnected', () => {
                peer.reconnect();
            });
        }

        function conectarAlEstudio() {
            if (!peer || peer.disconnected) return;

            let conn = peer.connect(MASTER_ID, { reliable: true });

            conn.on('open', () => {
                // SISTEMA INFALIBLE: En lugar de preguntar una sola vez, 
                // le preguntamos al estudio cada 3 segundos si está emitiendo.
                // El estudio (según tu código) lo ignorará si ya nos está enviando el audio.
                if (pingInterval) clearInterval(pingInterval);
                
                pingInterval = setInterval(() => {
                    if (conn && conn.open) {
                        conn.send({ command: 'check_live' });
                    }
                }, 3000);
            });

            // Si la conexión de datos se cierra o da error, intentamos reconectar
            conn.on('close', () => {
                clearInterval(pingInterval);
                setTimeout(conectarAlEstudio, 2000);
            });
            
            conn.on('error', () => {
                clearInterval(pingInterval);
                setTimeout(conectarAlEstudio, 2000);
            });
        }

        // Arrancamos el motor
        iniciarReceptor();
    </script>
</body>
</html>
