<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directo | Radio Maitino</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { 
            background-color: #000; 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        audio {
            width: 300px;
            outline: none;
        }
    </style>
</head>
<body>

    <audio id="reproductor" controls autoplay></audio>

    <script>
        const MASTER_ID = 'maitino-studio-host';
        const reproductor = document.getElementById('reproductor');
        
        let peer = null;
        let conn = null;
        let pingInterval = null;

        function iniciarReceptor() {
            // Limpieza profunda si venimos de un error previo
            if (peer) {
                peer.destroy();
            }

            peer = new Peer({ config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] } });

            peer.on('open', () => {
                conectarAlEstudio();
            });

            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (stream) => {
                    reproductor.srcObject = stream;
                    reproductor.play().catch(() => {
                        console.warn("Autoplay bloqueado. Requiere pulsar Play manualmente.");
                    });
                });
                
                call.on('close', () => { reproductor.srcObject = null; });
                call.on('error', () => { reproductor.srcObject = null; });
            });

            // Resiliencia 1: Desconexiones leves
            peer.on('disconnected', () => {
                if (!peer.destroyed) peer.reconnect();
            });

            // Resiliencia 2: Errores fatales (Reinicio completo del motor)
            peer.on('error', (err) => {
                console.error("Error en Peer:", err.type);
                setTimeout(iniciarReceptor, 5000);
            });
        }

        function conectarAlEstudio() {
            if (!peer || peer.disconnected) return;
            if (conn) conn.close();

            conn = peer.connect(MASTER_ID, { reliable: true });

            conn.on('open', () => {
                if (pingInterval) clearInterval(pingInterval);
                
                pingInterval = setInterval(() => {
                    // Ping inteligente: Solo avisa al estudio si NO estamos recibiendo audio activo
                    if (conn && conn.open) {
                        const noHayAudio = !reproductor.srcObject || !reproductor.srcObject.active;
                        if (noHayAudio) {
                            conn.send({ command: 'check_live' });
                        }
                    } else {
                        // Si el canal de datos murió en silencio, intentamos revivirlo
                        conectarAlEstudio();
                    }
                }, 3000);
            });

            conn.on('close', () => setTimeout(conectarAlEstudio, 3000));
            conn.on('error', () => setTimeout(conectarAlEstudio, 3000));
        }

        // Resiliencia 3: Si el navegador atasca el audio por un microcorte, lo sacudimos
        reproductor.addEventListener('stalled', () => {
            if (reproductor.srcObject) {
                console.warn("Audio atascado. Reenganchando flujo...");
                reproductor.load();
                reproductor.play().catch(e => console.error(e));
            }
        });

        // Arrancamos el motor
        iniciarReceptor();
    </script>
</body>
</html>
